<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Café Console</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<style>
  :root {
    --espresso: #2B1D14;
    --espresso-2: #3D2B1F;
    --crema: #F2E9DC;
    --paper: #FAF6EF;
    --gold: #C08A2E;
    --gold-bright: #D9A44C;
    --line: #C9B8A0;
    --ink: #2B1D14;
    --ink-soft: #6B5B47;
    --error: #A63D2F;
    --ok: #3D6B4A;
    --info: #2D6E8C;
    --radius: 3px;
    --mono: 'Courier New', Courier, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--espresso);
    color: var(--ink);
    font-family: Georgia, 'Times New Roman', serif;
    min-height: 100vh;
  }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 28px; background: var(--espresso-2); border-bottom: 2px solid var(--gold);
  }
  .brand { color: var(--crema); font-size: 20px; letter-spacing: 0.08em; text-transform: uppercase; }
  .brand span { color: var(--gold-bright); }
  .topbar-right { display:flex; align-items:center; gap:14px; }
  .userline { color: var(--line); font-family: var(--mono); font-size: 12px; }
  .btn {
    font-family: var(--mono); font-size: 13px; letter-spacing: 0.03em;
    padding: 9px 16px; border: 1px solid var(--gold); background: transparent;
    color: var(--gold-bright); cursor: pointer; border-radius: var(--radius); transition: background .15s;
  }
  .btn:hover { background: rgba(192,138,46,0.15); }
  .btn-solid { background: var(--gold); color: var(--espresso); border: 1px solid var(--gold); font-weight: bold; }
  .btn-solid:hover { background: var(--gold-bright); }
  .btn-danger { border-color: var(--error); color: var(--error); }
  .btn-danger:hover { background: rgba(166,61,47,0.12); }
  .btn-sm { padding: 5px 10px; font-size: 11px; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .icon-btn { background:none; border:none; cursor:pointer; color: var(--ink-soft); font-family: var(--mono); font-size: 13px; padding: 4px 8px; }
  .icon-btn:hover { color: var(--error); }

  .wrap { max-width: 920px; margin: 0 auto; padding: 32px 24px 80px; }

  .ticket {
    background: var(--paper); border-radius: var(--radius); position: relative;
    padding: 30px 34px; margin-bottom: 22px; box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  }
  .ticket::before, .ticket::after {
    content: ""; position: absolute; left: 0; right: 0; height: 12px;
    background-image: radial-gradient(circle, var(--espresso) 5px, transparent 5.5px);
    background-size: 20px 20px; background-position: 0 0;
  }
  .ticket::before { top: -6px; }
  .ticket::after { bottom: -6px; }

  h1 { font-size: 25px; margin: 0 0 4px; }
  h2 { font-size: 16px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-soft); margin: 0 0 16px; border-bottom: 1px dashed var(--line); padding-bottom: 10px; }
  h3 { font-size: 14px; margin: 0 0 8px; color: var(--ink); }
  .eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--gold); margin-bottom: 6px; }
  p.lead { color: var(--ink-soft); margin: 0 0 20px; }

  label { display:block; font-family: var(--mono); font-size: 11px; letter-spacing: 0.04em; color: var(--ink-soft); margin: 12px 0 5px; }
  input, textarea, select {
    width: 100%; font-family: Georgia, serif; font-size: 14px; padding: 9px 11px;
    border: 1px solid var(--line); border-radius: var(--radius); background: #fff; color: var(--ink);
  }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
  .row { display: flex; gap: 14px; align-items: flex-end; }
  .row > div { flex: 1; }
  .checkline { display:flex; align-items:center; gap:8px; margin: 12px 0; font-family: var(--mono); font-size: 12px; color: var(--ink-soft); }
  .checkline input { width: auto; }

  .tabs { display:flex; gap: 4px; margin-bottom: 22px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .tab {
    font-family: var(--mono); font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase;
    padding: 10px 16px; cursor: pointer; color: var(--ink-soft); border-bottom: 2px solid transparent;
  }
  .tab.active { color: var(--espresso); border-bottom-color: var(--gold); font-weight: bold; }
  .tab:hover { color: var(--espresso); }

  .stepper { display:flex; gap:6px; margin-bottom: 26px; }
  .step-dot { flex:1; height: 4px; background: rgba(0,0,0,0.1); border-radius: 2px; overflow:hidden; }
  .step-dot.done, .step-dot.active { background: var(--gold); }

  .category-block { border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; background: #fff; }
  .category-head { display:flex; align-items:center; justify-content:space-between; margin-bottom: 10px; }
  .category-title-edit { display:flex; gap:8px; align-items:center; flex:1; }
  .category-title-edit input { font-weight: bold; font-size: 15px; }

  .item-card { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin-top: 10px; background: var(--crema); }
  .item-head { display:flex; align-items:center; gap:10px; }
  .item-head .item-name { flex:1; font-weight: bold; }
  .item-price { font-family: var(--mono); color: var(--ink-soft); white-space: nowrap; }
  .item-meta { display:flex; gap:8px; align-items:center; }
  .item-detail { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }

  .pill { font-family: var(--mono); font-size: 10px; padding: 2px 8px; border-radius: 12px; background: rgba(61,107,74,0.12); color: var(--ok); text-transform: uppercase; }
  .pill.warn { background: rgba(166,61,47,0.12); color: var(--error); }
  .pill.muted { background: rgba(107,91,71,0.1); color: var(--ink-soft); }

  .variant-group { border: 1px dashed var(--line); border-radius: var(--radius); padding: 10px 12px; margin-top: 8px; background: #fff; }
  .variant-group-head { display:flex; align-items:center; gap:8px; margin-bottom: 8px; }
  .variant-option-row { display:flex; align-items:center; gap:8px; padding: 5px 0; }
  .variant-option-row .item-name { flex:1; font-size: 13px; }
  .variant-add-row { display:flex; gap:8px; margin-top: 8px; }
  .variant-add-row input, .variant-add-row select { font-size: 13px; padding: 6px 8px; }

  .qr-box { text-align:center; padding: 16px; background:#fff; border-radius: var(--radius); border:1px solid var(--line); position: relative; }
  .qr-box canvas, .qr-box img { display:block; margin: 0 auto; }
  .qr-caption { font-family: var(--mono); font-size: 10px; color: var(--ink-soft); margin-top: 8px; word-break: break-all; }
  .qr-delete { position:absolute; top:6px; right:6px; }

  .grid2 { display:grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 700px) { .grid2 { grid-template-columns: 1fr; } .row { flex-direction: column; align-items: stretch; } }

  .empty { padding: 36px 20px; text-align:center; color: var(--ink-soft); font-style: italic; border: 1px dashed var(--line); border-radius: var(--radius); }
  .msg { font-family: var(--mono); font-size: 13px; padding: 10px 14px; border-radius: var(--radius); margin-bottom: 16px; }
  .msg.error { background: rgba(166,61,47,0.1); color: var(--error); border:1px solid rgba(166,61,47,0.3); }
  .msg.ok { background: rgba(61,107,74,0.1); color: var(--ok); border:1px solid rgba(61,107,74,0.3); }

  .status-badge { display:inline-block; font-family: var(--mono); font-size: 11px; padding: 3px 10px; border-radius: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
  .status-pending { background: rgba(192,138,46,0.15); color: var(--gold); }
  .status-preparing { background: rgba(61,107,74,0.15); color: var(--ok); }
  .status-ready { background: rgba(45,110,140,0.15); color: var(--info); }
  .status-served { background: rgba(107,91,71,0.15); color: var(--ink-soft); }
  .status-cancelled { background: rgba(166,61,47,0.15); color: var(--error); }

  .center-screen { min-height: 80vh; display:flex; align-items:center; justify-content:center; }
  .login-card { width: 360px; }
  .tab-link { color: var(--gold-bright); font-family: var(--mono); font-size: 12px; cursor: pointer; text-decoration: underline; }
  .hidden { display:none !important; }
  .nav-actions { display:flex; justify-content: space-between; margin-top: 24px; }
  .small { font-size: 12px; color: var(--ink-soft); font-family: var(--mono); }
  .divider { border: none; border-top: 1px dashed var(--line); margin: 18px 0; }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">Café <span>Console</span></div>
  <div class="topbar-right" id="topbar-right"></div>
</div>

<div class="wrap" id="app-root"></div>

<script>
// ===== Configuration: your live Supabase project =====
const SUPABASE_URL = 'https://yhrhqfqdxtgifahvkrnw.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_N91RJWdVtL5LgpB7u5uLAA_3NcHqYtt';
const PLATFORM_DOMAIN = 'tabl0.com';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let state = {
  user: null,
  tenant: null,
  role: 'owner', // 'owner' | 'staff' | 'kitchen'
  step: 1,
  view: 'loading',
  homeTab: 'orders',
  categories: [],
  items: [],
  variantGroups: [],
  variantOptions: [],
  tables: [],
  loyalty: null,
  orders: [],
  orderItems: [],
  expandedItemId: null,
  copySourceItemId: {} // itemId -> chosen source item id for "copy variants"
};

const root = document.getElementById('app-root');
const topbarRight = document.getElementById('topbar-right');

// ---------- Boot ----------
async function boot() {
  // Must happen BEFORE the session check below — with PKCE flow (current
  // supabase-js default), an invite link has no session at all until this
  // exchange runs, so gating this behind "if session exists" never fires.
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get('code')) {
    const isPendingInvite = await checkForPendingInvite();
    if (isPendingInvite) return;
  }

  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    state.user = session.user;
    const isPendingInvite = await checkForPendingInvite();
    if (isPendingInvite) return;
    await loadTenant();
  } else {
    state.view = 'login';
    render();
  }
}
boot();

sb.auth.onAuthStateChange((event) => {
  if (event === 'SIGNED_OUT') {
    state = { ...state, user: null, tenant: null, view: 'login' };
    render();
  }
});

async function loadTenant() {
  const { data, error } = await sb.from('tenants').select('*').eq('owner_user_id', state.user.id).maybeSingle();
  if (error) console.error(error);
  if (data) {
    state.tenant = data;
    state.role = 'owner';
    state.view = 'home';
    await loadAll();
    subscribeOrders();
    render();
    return;
  }

  // Not an owner — check staff/kitchen membership
  const { data: memberships } = await sb.rpc('my_staff_membership');
  if (memberships && memberships.length > 0) {
    const m = memberships[0];
    const { data: tenantRow } = await sb.from('tenants').select('*').eq('id', m.tenant_id).maybeSingle();
    state.tenant = tenantRow;
    state.role = m.role;
    if (m.role === 'kitchen') {
      state.view = 'kitchen';
      await loadOrders();
      subscribeOrdersForKitchen();
    } else {
      state.view = 'home';
      await loadAll();
      subscribeOrders();
    }
    render();
    return;
  }

  state.view = 'wizard';
  state.step = 1;
  render();
}

async function loadAll() {
  await Promise.all([loadMenu(), loadTables(), loadLoyalty(), loadOrders(), loadMyTickets()]);
}

async function loadMenu() {
  const tid = state.tenant.id;
  const [{ data: cats }, { data: items }, { data: groups }, { data: options }] = await Promise.all([
    sb.from('menu_categories').select('*').eq('tenant_id', tid).order('sort_order'),
    sb.from('menu_items').select('*').eq('tenant_id', tid).order('sort_order'),
    sb.from('menu_item_variant_groups').select('*').eq('tenant_id', tid).order('sort_order'),
    sb.from('menu_item_variant_options').select('*').eq('tenant_id', tid).order('sort_order'),
  ]);
  state.categories = cats || [];
  state.items = items || [];
  state.variantGroups = groups || [];
  state.variantOptions = options || [];
}

async function loadTables() {
  const { data } = await sb.from('tables').select('*').eq('tenant_id', state.tenant.id).order('table_code');
  state.tables = data || [];
}

async function loadLoyalty() {
  const { data } = await sb.from('loyalty_programs').select('*').eq('tenant_id', state.tenant.id).maybeSingle();
  state.loyalty = data;
}

async function loadOrders() {
  const { data } = await sb.from('orders').select('*').eq('tenant_id', state.tenant.id).order('created_at', { ascending: false }).limit(30);
  state.orders = data || [];

  if (state.orders.length > 0) {
    const orderIds = state.orders.map(o => o.id);
    const { data: items } = await sb.from('order_items').select('*').in('order_id', orderIds);
    state.orderItems = items || [];
  } else {
    state.orderItems = [];
  }
}

function subscribeOrders() {
  sb.channel('orders-' + state.tenant.id)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'orders', filter: `tenant_id=eq.${state.tenant.id}` }, () => {
      loadOrders().then(render);
    })
    .subscribe();
}

// ---------- Kitchen: sound + notification alert on NEW orders only ----------
// Browsers block audio from playing unless it's tied to a real user tap/click —
// a fresh AudioContext created inside an async Realtime callback (no gesture
// attached) gets silently blocked, even though the code runs without error.
// Fix: create ONE AudioContext up front, unlocked by a real tap, then reuse
// it for every subsequent alert (including ones triggered by Realtime events).
let alertAudioCtx = null;
let audioUnlocked = false;

function unlockAudioAlerts() {
  if (!alertAudioCtx) {
    alertAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (alertAudioCtx.state === 'suspended') {
    alertAudioCtx.resume();
  }
  audioUnlocked = true;
  requestNotificationPermission();
  playAlertSound(); // immediate confirmation beep so staff know it worked
  render();
}

function playAlertSound() {
  if (!alertAudioCtx) return; // not unlocked yet — nothing we can do until a tap happens
  try {
    if (alertAudioCtx.state === 'suspended') alertAudioCtx.resume();
    const now = alertAudioCtx.currentTime;
    [0, 0.18].forEach((offset, i) => {
      const osc = alertAudioCtx.createOscillator();
      const gain = alertAudioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(i === 0 ? 880 : 1046.5, now + offset);
      gain.gain.setValueAtTime(0.0001, now + offset);
      gain.gain.exponentialRampToValueAtTime(0.35, now + offset + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + offset + 0.32);
      osc.connect(gain).connect(alertAudioCtx.destination);
      osc.start(now + offset);
      osc.stop(now + offset + 0.35);
    });
  } catch (e) { console.warn('Could not play alert sound', e); }
}

function requestNotificationPermission() {
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }
}

function showNewOrderNotification(order) {
  if ('Notification' in window && Notification.permission === 'granted') {
    const n = new Notification('New order received', {
      body: `Table order · ${money(order.total || 0)} EGP`,
      tag: order.id
    });
    setTimeout(() => n.close(), 8000);
  }
}

function subscribeOrdersForKitchen() {
  sb.channel('kitchen-orders-' + state.tenant.id)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'orders', filter: `tenant_id=eq.${state.tenant.id}` }, (payload) => {
      playAlertSound();
      showNewOrderNotification(payload.new);
      loadOrders().then(render);
    })
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'orders', filter: `tenant_id=eq.${state.tenant.id}` }, () => {
      loadOrders().then(render);
    })
    .subscribe();
}

// ---------- Auth ----------
async function handleLogin(email, password) {
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) {
    // Supabase deliberately gives the same generic error whether the email
    // doesn't exist or the password is wrong (prevents attackers probing
    // which emails have accounts). We can't know which case this is — but
    // we can still point people toward the right next step either way.
    return showMsg('login-msg', "Couldn't sign in — check your email and password. If you don't have a café account yet, use \"Register your café\" instead.", 'error');
  }
  const { data: { session } } = await sb.auth.getSession();
  state.user = session.user;
  await loadTenant();
}
async function handleSignup(email, password, cafeName) {
  const { data, error } = await sb.auth.signUp({ email, password, options: { emailRedirectTo: `https://${PLATFORM_DOMAIN}/console.html` } });
  if (error) return showMsg('login-msg', error.message, 'error');
  if (!data.session) return showMsg('login-msg', 'Check your email to confirm your account, then sign in.', 'ok');
  state.user = data.session.user;
  if (cafeName) {
    await createTenant(cafeName, '');
    await sb.rpc('accept_terms', { p_tenant_id: state.tenant.id });
    state.view = 'plan-selection';
    render();
  } else {
    await loadTenant();
  }
}

function renderPlanSelection() {
  topbarRight.innerHTML = `<span class="userline">${state.user.email}</span><button class="btn" onclick="handleLogout()">Sign out</button>`;
  root.innerHTML = `
    <div class="ticket">
      <div class="eyebrow">Almost there</div>
      <h1>Choose how you'd like to pay</h1>
      <p class="lead">Building your menu, tables, and everything in this dashboard is always free. This only applies once you start taking real orders from customers.</p>
      <div class="grid2">
        <div class="category-block">
          <h3 style="font-size:18px">Pay-as-you-go</h3>
          <div style="font-size:28px;font-weight:bold;margin:8px 0">0.8%<span style="font-size:14px;font-weight:normal;color:var(--ink-soft)"> per order</span></div>
          <p class="small">No monthly fee. Best if you're just getting started or have lower order volume.</p>
          <button class="btn btn-solid" style="width:100%;margin-top:14px" onclick="choosePlan('payg')">Choose Pay-as-you-go</button>
        </div>
        <div class="category-block" style="border-color:var(--gold)">
          <h3 style="font-size:18px">Pro</h3>
          <div style="font-size:28px;font-weight:bold;margin:8px 0">800 EGP<span style="font-size:14px;font-weight:normal;color:var(--ink-soft)">/month</span></div>
          <p class="small">0% per order — keep 100% of every sale. Best once you're doing steady volume.</p>
          <button class="btn btn-solid" style="width:100%;margin-top:14px" onclick="choosePlan('pro')">Choose Pro</button>
        </div>
      </div>
      <p class="small" style="margin-top:16px;text-align:center">You can switch plans anytime from Settings.</p>
    </div>
  `;
}

async function choosePlan(plan) {
  if (plan === 'payg') {
    await sb.rpc('set_billing_plan', { p_tenant_id: state.tenant.id, p_plan: 'payg' });
    state.tenant.billing_plan = 'payg';
    state.tenant.platform_fee_percent = 0.8;
    state.step = 2;
    state.view = 'wizard';
    render();
  } else {
    await startProCheckout();
  }
}

async function handleAutoRenewToggle(enabled) {
  const { data } = await sb.rpc('toggle_auto_renew', { p_tenant_id: state.tenant.id, p_enabled: enabled });
  if (data && data.error) {
    alert(data.error);
    renderBillingTab(); // reset the checkbox visually since the change didn't take effect
    return;
  }
  state.tenant.auto_renew = enabled;
}
async function switchToPayg() {
  if (!confirm('Switch to Pay-as-you-go? If auto-renewal is on, turn it off first in Settings — otherwise your saved card may be charged again at the next renewal date.')) return;
  await sb.rpc('set_billing_plan', { p_tenant_id: state.tenant.id, p_plan: 'payg' });
  state.tenant.billing_plan = 'payg';
  state.tenant.platform_fee_percent = 0.8;
  render();
}

function showProBillingCycleChoice() {
  document.querySelectorAll('.overlay').forEach(el => el.remove());
  const body = document.getElementById('tab-body');
  if (!body) return;
  body.innerHTML = `
    <div class="ticket">
      <h2>Choose your billing cycle</h2>
      <div style="display:flex;gap:12px;margin-top:14px">
        <div class="category-block" style="flex:1;text-align:center;cursor:pointer" onclick="startProCheckout('monthly')">
          <h3 style="font-size:16px">Monthly</h3>
          <div style="font-size:24px;font-weight:bold;margin:8px 0">800 EGP</div>
          <p class="small">Billed every 30 days</p>
        </div>
        <div class="category-block" style="flex:1;text-align:center;cursor:pointer;border-color:var(--gold)" onclick="startProCheckout('annual')">
          <h3 style="font-size:16px">Annual <span class="pill ok">Save 2 months</span></h3>
          <div style="font-size:24px;font-weight:bold;margin:8px 0">8000 EGP</div>
          <p class="small">Billed every 365 days — vs 9600 EGP paying monthly</p>
        </div>
      </div>
    </div>
  `;
}
async function startProCheckout(billingCycle) {
  const cycle = billingCycle === 'annual' ? 'annual' : 'monthly';
  const { data: { session } } = await sb.auth.getSession();
  const res = await fetch(`${SUPABASE_URL}/functions/v1/paymob-pro-create-payment`, {
    method: 'POST',
    headers: { 'Authorization': `Bearer ${session.access_token}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({ tenant_id: state.tenant.id, redirect_url: window.location.origin + window.location.pathname, billing_cycle: cycle })
  });
  const data = await res.json();
  if (data.error) {
    alert('Pro plan payment isn\'t available yet: ' + data.error + '\n\nYou can continue with Pay-as-you-go for now.');
    return;

// ============================================================
// KITCHEN INVITE ACCEPTANCE — an invited staff member clicks the emailed
// link, Supabase auto-authenticates them with a temporary session, and we
// prompt them to set a real password before completing their join.
// ============================================================
async function checkForPendingInvite() {
  // Newer supabase-js defaults to PKCE flow for invite links — the link
  // carries a ?code=... param that needs an explicit exchange to actually
  // establish a session, rather than the older hash-based auto-detection.
  // Without this, updateUser() later fails with "Auth session missing!"
  // even though the invite link itself was completely valid.
  const urlParams = new URLSearchParams(window.location.search);
  const authCode = urlParams.get('code');
  if (authCode) {
    const { error } = await sb.auth.exchangeCodeForSession(window.location.href);
    if (error) console.error('Failed to exchange invite code for session:', error);
  }

  const { data: { session } } = await sb.auth.getSession();
  if (!session) return false;
  // Supabase includes type=invite in the URL hash when this session came
  // from an invite link (not a normal sign-in) — check both the raw hash
  // (before Supabase's client strips it) and the user's own metadata as a
  // fallback, since the hash may already be gone by the time this runs.
  const cameFromInviteLink = window.location.hash.includes('type=invite') || authCode;
  const hasPendingInviteMetadata = !!(session.user.user_metadata && session.user.user_metadata.invited_tenant_id);
  if (cameFromInviteLink || hasPendingInviteMetadata) {
    state.user = session.user;
    state.view = 'set-invite-password';
    render();
    return true;
  }
  return false;
}

  root.innerHTML = `

        <h1>Join ${escapeHtml(tenantName)}'s kitchen</h1>

async function completeInviteSetup() {
  const password = document.getElementById('invite-password').value;
  const confirm = document.getElementById('invite-password-confirm').value;
  if (!password || password.length < 6) return showMsg('invite-pw-msg', 'Password must be at least 6 characters.', 'error');
  if (password !== confirm) return showMsg('invite-pw-msg', 'Passwords don\'t match.', 'error');

  const { error: pwError } = await sb.auth.updateUser({ password });
  if (pwError) return showMsg('invite-pw-msg', pwError.message, 'error');

  const { data: joinResult, error: joinError } = await sb.rpc('accept_kitchen_invite');
  if (joinError || (joinResult && joinResult.error)) {
    return showMsg('invite-pw-msg', 'Password set, but joining the café failed. Please contact your café owner.', 'error');
  }
  // Clear the invite flag so future normal logins don't re-trigger this screen
  await sb.auth.updateUser({ data: { invited_tenant_id: null } });
  await loadTenant();
}

// REPORTS — shift/day/week/month/year order reports with Excel/PDF export
// ============================================================
let reportState = {
  rangeLabel: 'Today',
  start: null,
  end: null,
  orders: [],
  loaded: false
};

function setReportRange(label) {
  const now = new Date();
  let start, end;
  if (label === 'Today') {
    start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    end = new Date(start); end.setDate(end.getDate() + 1);
  } else if (label === 'Yesterday') {
    end = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    start = new Date(end); start.setDate(start.getDate() - 1);
  } else if (label === 'This Week') {
    const day = now.getDay();
    start = new Date(now.getFullYear(), now.getMonth(), now.getDate() - day);
    end = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
  } else if (label === 'This Month') {
    start = new Date(now.getFullYear(), now.getMonth(), 1);
    end = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
  } else if (label === 'This Year') {
    start = new Date(now.getFullYear(), 0, 1);
    end = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
  }
  reportState.rangeLabel = label;
  reportState.start = start;
  reportState.end = end;
  generateReport();
}

function toDatetimeLocalValue(d) {
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function applyCustomReportRange() {
  const startVal = document.getElementById('report-start').value;
  const endVal = document.getElementById('report-end').value;
  if (!startVal || !endVal) return;
  reportState.rangeLabel = 'Custom range';
  reportState.start = new Date(startVal);
  reportState.end = new Date(endVal);
  generateReport();
}

async function generateReport() {
  reportState.loaded = false;
  renderReportsTab();
  const { data: orders } = await sb.from('orders').select('*')
    .eq('tenant_id', state.tenant.id)
    .gte('created_at', reportState.start.toISOString())
    .lt('created_at', reportState.end.toISOString())
    .order('created_at');
  const orderIds = (orders || []).map(o => o.id);
  let items = [];
  if (orderIds.length > 0) {
    const { data: itemRows } = await sb.from('order_items').select('*').in('order_id', orderIds);
    items = itemRows || [];
  }
  reportState.orders = (orders || []).map(o => ({ ...o, items: items.filter(i => i.order_id === o.id) }));
  reportState.loaded = true;
  renderReportsTab();
}

function togglePaymentMethodDetail(method) {
  const el = document.getElementById(`pm-detail-${method}`);

function computeReportStats(orders) {
  const validOrders = orders.filter(o => o.status !== 'cancelled');
  const grossSales = validOrders.reduce((s, o) => s + Number(o.subtotal || 0), 0);
  const totalDiscounts = validOrders.reduce((s, o) => s + Number(o.reward_discount || 0), 0);
  const netSales = validOrders.reduce((s, o) => s + Number(o.total || 0), 0);
  const orderCount = validOrders.length;
  const avgOrderValue = orderCount ? netSales / orderCount : 0;
  const cancelledCount = orders.length - validOrders.length;
  const rewardOrders = validOrders.filter(o => Number(o.reward_discount || 0) > 0).length;
  const feePercent = Number(state.tenant.platform_fee_percent || 0);
  const platformFee = grossSales * feePercent / 100;
  const netAfterPlatformFee = netSales - platformFee;

  const statusCounts = {};
  orders.forEach(o => { statusCounts[o.status] = (statusCounts[o.status] || 0) + 1; });

  const itemMap = {};
  validOrders.forEach(o => o.items.forEach(i => {
    if (!itemMap[i.item_name]) itemMap[i.item_name] = { name: i.item_name, qty: 0, revenue: 0 };
    itemMap[i.item_name].qty += i.quantity;
    itemMap[i.item_name].revenue += Number(i.line_total || 0);
  }));
  const itemBreakdown = Object.values(itemMap).sort((a, b) => b.revenue - a.revenue);

  const hourMap = {};
  validOrders.forEach(o => {
    const h = new Date(o.created_at).getHours();
    hourMap[h] = (hourMap[h] || 0) + 1;
  });

  // How customers actually paid — pay at counter vs which specific gateway.
  // Recorded per-order at the moment of payment, not inferred from the
  // café's current gateway setting (which could have changed since).
  const methodLabels = { counter: 'Pay at counter', paymob: 'Paymob', kashier: 'Kashier', paytabs: 'PayTabs', fawry: 'Fawry', stripe: 'Stripe' };
  const methodMap = {};
  validOrders.forEach(o => {
    const method = o.payment_method || 'counter';
    if (!methodMap[method]) methodMap[method] = { method, label: methodLabels[method] || method, count: 0, total: 0 };
    methodMap[method].count += 1;
    methodMap[method].total += Number(o.total || 0);
  });
  const paymentMethodBreakdown = Object.values(methodMap).sort((a, b) => b.total - a.total);

  return { grossSales, totalDiscounts, netSales, orderCount, avgOrderValue, cancelledCount, rewardOrders, statusCounts, itemBreakdown, hourMap, feePercent, platformFee, netAfterPlatformFee, paymentMethodBreakdown };
}

function exportReportExcel() {
  const stats = computeReportStats(reportState.orders);
  const wb = XLSX.utils.book_new();

  const summaryData = [
    ['Tabl0 Order Report'],
    ['Café', state.tenant.name],
    ['Range', reportState.rangeLabel],
    ['From', reportState.start.toLocaleString()],
    ['To', reportState.end.toLocaleString()],
    ['Generated', new Date().toLocaleString()],
    [],
    ['Gross Sales (EGP)', stats.grossSales.toFixed(2)],
    ['Loyalty Discounts Given (EGP)', stats.totalDiscounts.toFixed(2)],
    ['Net Sales / To Reconcile (EGP)', stats.netSales.toFixed(2)],
    ['Tabl0 Platform Fee (' + stats.feePercent + '%, EGP)', stats.platformFee.toFixed(2)],
    ['Net After Platform Fee — Take-Home (EGP)', stats.netAfterPlatformFee.toFixed(2)],
    ['Order Count', stats.orderCount],
    ['Average Order Value (EGP)', stats.avgOrderValue.toFixed(2)],
    ['Orders With Reward Redeemed', stats.rewardOrders],
    ['Cancelled Orders', stats.cancelledCount],
  ];
  const wsSummary = XLSX.utils.aoa_to_sheet(summaryData);
  XLSX.utils.book_append_sheet(wb, wsSummary, 'Summary');

  const itemRows = [['Item', 'Quantity Sold', 'Revenue (EGP)']];
  stats.itemBreakdown.forEach(i => itemRows.push([i.name, i.qty, i.revenue.toFixed(2)]));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(itemRows), 'Sales by Item');

  const orderRows = [['Order ID', 'Date/Time', 'Table', 'Status', 'Payment Status', 'Payment Method', 'Payment Reference', 'Items', 'Subtotal', 'Discount', 'Total', 'Cancellation Reason', 'Notes']];
  reportState.orders.forEach(o => {
    const itemsSummary = o.items.map(i => `${i.quantity}x ${i.item_name}`).join('; ');
    orderRows.push([
      o.id, new Date(o.created_at).toLocaleString(), o.table_id ? o.table_id.slice(0,8) : '',
      o.status, o.payment_status, o.payment_method || 'counter', o.payment_reference || '', itemsSummary,
      Number(o.subtotal || 0).toFixed(2), Number(o.reward_discount || 0).toFixed(2), Number(o.total || 0).toFixed(2),
      o.cancellation_reason || '', o.notes || ''
    ]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(orderRows), 'Order Detail');

  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([
    ['Payment Method', 'Orders', 'Total (EGP)'],
    ...stats.paymentMethodBreakdown.map(m => [m.label, m.count, m.total.toFixed(2)])
  ]), 'Payment Methods');

  const cancelledOrders = reportState.orders.filter(o => o.status === 'cancelled');
  if (cancelledOrders.length > 0) {
    const cancelRows = [['Order ID', 'Date/Time', 'Would-be Total', 'Reason']];
    cancelledOrders.forEach(o => cancelRows.push([o.id, new Date(o.created_at).toLocaleString(), Number(o.total||0).toFixed(2), o.cancellation_reason || '']));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(cancelRows), 'Cancelled Orders');
  }

  const filename = `Tabl0_Report_${state.tenant.slug}_${reportState.rangeLabel.replace(/\s+/g,'_')}_${new Date().toISOString().slice(0,10)}.xlsx`;
  XLSX.writeFile(wb, filename);
}

function renderOrdersTab() {
  const gatewayLabels = { paymob: 'Paymob', kashier: 'Kashier', paytabs: 'PayTabs', fawry: 'Fawry', stripe: 'Stripe' };

    ? state.orders.filter(o => o.payment_status === 'paid')

}

function renderOrderCard(o) {
  const lines = state.orderItems.filter(oi => oi.order_id === o.id);
  const table = state.tables.find(t => t.id === o.table_id);
  const tableLabel = table ? (table.display_name || table.table_code) : o.table_id.slice(0,4);
  const isCancelled = o.status === 'cancelled';
  return `
    <div style="padding:10px 0;border-bottom:1px dashed var(--line)">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
        <span style="flex:1;font-weight:bold">Table ${escapeHtml(tableLabel)} <span class="small" style="font-weight:normal">· #${o.id.slice(0,8)}</span></span>
        <span class="status-badge status-${o.status}">${o.status}</span>
        ${isCancelled ? '' : `
          <select onchange="updateOrderStatus('${o.id}', this.value)" style="width:auto">
            <option value="pending" ${o.status==='pending'?'selected':''}>Pending</option>
            <option value="preparing" ${o.status==='preparing'?'selected':''}>Preparing</option>
            <option value="ready" ${o.status==='ready'?'selected':''}>Ready</option>
            <option value="served" ${o.status==='served'?'selected':''}>Served</option>
          </select>
          <button class="icon-btn" style="color:var(--error)" onclick="cancelOrder('${o.id}')" title="Cancel this order">✕ Cancel</button>
        `}
      </div>
      ${isCancelled && o.cancellation_reason ? `<div class="msg error" style="margin-bottom:8px">Cancelled: ${escapeHtml(o.cancellation_reason)}</div>` : ''}
      ${lines.length === 0 ? '<div class="small">No items recorded for this order</div>' : lines.map(li => `
        <div style="display:flex;justify-content:space-between;padding:3px 0 3px 12px;font-size:13px">
          <span>${li.quantity}× ${escapeHtml(li.item_name)}${renderVariantSummary(li.selected_variants)}</span>
          <span class="item-price">${money(li.line_total)} EGP</span>
        </div>
      `).join('')}
      ${o.reward_discount > 0 ? `<div style="display:flex;justify-content:space-between;padding:3px 0 3px 12px;font-size:13px;color:var(--ok)"><span>Reward applied</span><span>-${money(o.reward_discount)} EGP</span></div>` : ''}
      <div style="display:flex;justify-content:flex-end;padding-top:4px;font-weight:bold">${money(o.total)} EGP</div>
      ${o.notes ? `<div class="small" style="padding-left:12px">Note: ${escapeHtml(o.notes)}</div>` : ''}
    </div>
  `;
}

function renderVariantSummary(selectedVariants) {
  if (!selectedVariants || !Array.isArray(selectedVariants) || selectedVariants.length === 0) return '';
  const names = selectedVariants.map(v => v.name).filter(Boolean);
  return names.length ? ` <span class="small">(${escapeHtml(names.join(', '))})</span>` : '';
}

function renderKitchen() {
  topbarRight.innerHTML = `<span class="userline">Kitchen · ${escapeHtml(state.tenant ? state.tenant.name : '')}</span><button class="btn" onclick="handleLogout()">Sign out</button>`;

  // For cafés with online payment enabled, an order shouldn't be actionable
  // by the kitchen until it's actually confirmed paid — otherwise a
  // customer could abandon checkout entirely and still get their order
  // made. Cafés on "pay at counter" (no gateway connected) are unaffected,
  // since that flow always expected payment to happen after preparation.
  const requiresOnlinePayment = state.tenant && state.tenant.payment_gateway_status === 'configured';
  const visibleOrders = requiresOnlinePayment
    ? state.orders.filter(o => o.payment_status === 'paid')
    : state.orders;
  const awaitingPayment = requiresOnlinePayment
    ? state.orders.filter(o => o.payment_status !== 'paid' && o.status !== 'cancelled')
    : [];

  const active = visibleOrders.filter(o => o.status !== 'served' && o.status !== 'cancelled');
  const pending = active.filter(o => o.status === 'pending');
  const preparing = active.filter(o => o.status === 'preparing');
  const ready = active.filter(o => o.status === 'ready');

  root.innerHTML = `
    <div style="padding:20px">
      ${awaitingPayment.length > 0 ? `
        <div class="msg" style="background:rgba(107,91,71,0.1);color:var(--ink-soft);border:1px solid var(--line);font-size:13px;padding:10px 16px;margin-bottom:12px">

        </div>
      ` : ''}
      ${!audioUnlocked ? `
        <div class="msg" style="background:rgba(192,138,46,0.15);color:var(--gold);border:1px solid var(--gold);font-size:15px;padding:14px 18px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center">
          <span>🔔 Tap to enable sound alerts for new orders — required once per session, browsers block sound otherwise.</span>
          <button class="btn btn-solid" onclick="unlockAudioAlerts()">Enable sound</button>
        </div>
      ` : ''}
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
        <h1 style="font-size:28px">Live Orders</h1>
        ${audioUnlocked ? '<button class="btn" onclick="playAlertSound()" title="Test alert sound">🔊 Test sound</button>' : ''}
      </div>
      ${active.length === 0 ? '<div class="empty" style="font-size:18px;padding:80px 20px">No active orders. New orders will appear here with a sound alert.</div>' : `
        <div class="grid2" style="grid-template-columns:1fr 1fr 1fr;gap:16px">
          ${renderKitchenColumn('Pending', pending, '#C08A2E')}
          ${renderKitchenColumn('Preparing', preparing, '#3D6B4A')}
          ${renderKitchenColumn('Ready', ready, '#2D6E8C')}
        </div>
      `}
    </div>
  `;
}

        <label for="drink-cat-${c.id}" style="margin:0;display:inline">This is a drinks category — items here count toward loyalty rewards</label>
      </div>
      ${items.map(i => renderItemCard(i, otherItemsFn)).join('')}
      <div class="row" style="margin-top:12px">
        <div><input id="new-item-name-${c.id}" placeholder="New item name" /></div>
        <div style="flex:0 0 90px"><input id="new-item-price-${c.id}" placeholder="EGP" /></div>
        <div style="flex:0 0 auto"><button class="btn btn-sm" onclick="menuAddItem('${c.id}')">Add item</button></div>
      </div>
    </div>
  `;
}

function renderItemCard(item, otherItemsFn) {
  const expanded = state.expandedItemId === item.id;
  const groups = state.variantGroups.filter(g => g.menu_item_id === item.id);
  const others = otherItemsFn(item.id);
  return `
    <div class="item-card">
      <div class="item-head">
        <span class="item-name">${escapeHtml(item.name)}</span>
        ${item.sold_out ? '<span class="pill warn">Sold out</span>' : ''}
        ${groups.length ? `<span class="pill muted">${groups.length} variant group${groups.length===1?'':'s'}</span>` : ''}
        ${item.prep_time_minutes ? `<span class="pill muted">~${item.prep_time_minutes} min</span>` : ''}
        <span class="item-price">${money(item.base_price)} EGP</span>
        <button class="btn btn-sm" onclick="toggleItemDetail('${item.id}')">${expanded ? 'Close' : 'Edit'}</button>
      </div>
      ${expanded ? `
        <div class="item-detail">
          <div class="row">
            <div><label>Name</label><input id="edit-name-${item.id}" value="${escapeHtml(item.name)}"/></div>
            <div style="flex:0 0 100px"><label>Price (EGP)</label><input id="edit-price-${item.id}" value="${item.base_price}"/></div>
            <div style="flex:0 0 110px"><label>Prep time (min)</label><input id="edit-prep-${item.id}" value="${item.prep_time_minutes || ''}" placeholder="8"/></div>
          </div>
          <label>Description</label>
          <textarea id="edit-desc-${item.id}" rows="2">${escapeHtml(item.description || '')}</textarea>
          <label>Photo URL</label>
          <input id="edit-photo-${item.id}" value="${escapeHtml(item.photo_url || '')}" placeholder="https://…"/>
          <div class="checkline" style="margin-top:12px">
            <input type="checkbox" id="edit-loyalty-${item.id}" ${item.counts_toward_loyalty !== false ? 'checked' : ''} onchange="toggleCountsTowardLoyalty('${item.id}', this.checked)"/>
            <label for="edit-loyalty-${item.id}" style="margin:0;display:inline">Counts toward loyalty rewards (only matters if this item's category is marked as a drinks category above)</label>
          </div>
          <div class="nav-actions">
            <div>
              <button class="btn btn-sm ${item.sold_out ? '' : 'btn-danger'}" onclick="toggleSoldOut('${item.id}', ${item.sold_out})">${item.sold_out ? 'Mark in stock' : 'Mark sold out'}</button>
              <button class="btn btn-sm btn-danger" onclick="deleteItem('${item.id}')">Delete item</button>
            </div>
            <button class="btn btn-sm btn-solid" onclick="saveItemEdits('${item.id}')">Save</button>
          </div>

          <hr class="divider"/>
          <h3>Variants (size, milk type, add-ons…)</h3>
          ${others.length ? `
            <div class="row" style="align-items:center">
              <div style="flex:0 0 auto" class="small">Copy variants from</div>
              <div>
                <select id="copy-src-${item.id}">
                  <option value="">Choose an item…</option>
                  ${others.map(o => `<option value="${o.id}">${escapeHtml(o.name)}</option>`).join('')}
                </select>
              </div>
              <div style="flex:0 0 auto"><button class="btn btn-sm" onclick="copyVariantsToItem('${item.id}', document.getElementById('copy-src-${item.id}').value)">Copy</button></div>
            </div>
          ` : ''}
          ${groups.map(g => renderVariantGroup(g)).join('')}
          <div class="variant-add-row">
            <input id="new-group-name-${item.id}" placeholder="Group name, e.g. Size or Milk type" style="flex:1"/>
            <select id="new-group-type-${item.id}" style="flex:0 0 120px">
              <option value="single">Single choice</option>
              <option value="multiple">Multiple choice</option>
            </select>
            <label class="checkline" style="margin:0"><input type="checkbox" id="new-group-required-${item.id}"/> Required</label>
            <button class="btn btn-sm" onclick="menuAddVariantGroup('${item.id}')">Add group</button>
          </div>
        </div>
      ` : ''}
    </div>
  `;
}

function renderVariantGroup(g) {
  const options = state.variantOptions.filter(o => o.variant_group_id === g.id);
  return `
    <div class="variant-group">
      <div class="variant-group-head">
        <strong style="flex:1">${escapeHtml(g.name)}</strong>
        <span class="small">${g.selection_type === 'single' ? 'pick one' : 'pick any'}</span>
        <label class="checkline" style="margin:0">
          <input type="checkbox" ${g.required ? 'checked' : ''} onchange="updateVariantGroupRequired('${g.id}', this.checked)"/> Required
        </label>
        <button class="icon-btn" onclick="deleteVariantGroup('${g.id}')" title="Delete group">✕</button>
      </div>
      ${options.map(o => `
        <div class="variant-option-row">
          <span class="item-name">${escapeHtml(o.name)}${o.sold_out ? ' <span class="pill warn">sold out</span>' : ''}</span>
          <span class="small">${o.price_delta >= 0 ? '+' : ''}${money(o.price_delta)} EGP</span>
          <button class="icon-btn" onclick="toggleOptionSoldOut('${o.id}', ${o.sold_out})" title="Toggle sold out">⦿</button>
          <button class="icon-btn" onclick="deleteVariantOption('${o.id}')" title="Delete option">✕</button>
        </div>
      `).join('') || '<div class="small">No options yet</div>'}
      <div class="variant-add-row">
        <input id="new-opt-name-${g.id}" placeholder="Option name, e.g. Large" style="flex:1"/>
        <input id="new-opt-delta-${g.id}" placeholder="Price +/- EGP" style="flex:0 0 110px"/>
        <button class="btn btn-sm" onclick="menuAddVariantOption('${g.id}')">Add option</button>
      </div>
    </div>
  `;
}

function menuAddCategory() {
  const el = document.getElementById('m-cat-name');
  addCategoryLive(el.value); el.value = '';
}
function menuAddItem(catId) {
  const nameEl = document.getElementById('new-item-name-' + catId);
  const priceEl = document.getElementById('new-item-price-' + catId);
  addItemLive(catId, nameEl.value, priceEl.value);
  nameEl.value = ''; priceEl.value = '';
}
function menuAddVariantGroup(itemId) {
  const name = document.getElementById('new-group-name-' + itemId).value;
  const type = document.getElementById('new-group-type-' + itemId).value;
  const required = document.getElementById('new-group-required-' + itemId).checked;
  addVariantGroup(itemId, name, type, required);
}
function menuAddVariantOption(groupId) {
  const name = document.getElementById('new-opt-name-' + groupId).value;
  const delta = document.getElementById('new-opt-delta-' + groupId).value;
  addVariantOption(groupId, name, delta);
}

function renderTablesTab() {
  return `
    <div class="ticket">
      <h2>Tables &amp; QR codes</h2>
      <div id="tables-msg" class="msg hidden"></div>
      <div class="row" style="margin-bottom:20px">
        <div><label>Table code</label><input id="t-code" placeholder="A07"/></div>
        <div><label>Display name (optional)</label><input id="t-name" placeholder="Patio Table 7"/></div>
        <div style="flex:0 0 auto"><button class="btn btn-solid" onclick="addTableLive()">Generate QR</button></div>
      </div>
      <div class="grid2">${state.tables.map(t => tableQrBlock(t, true)).join('') || '<div class="empty">No tables yet</div>'}</div>
    </div>
  `;
}

function renderLoyaltyTab() {
  const lp = state.loyalty || {};
  return `
    <div class="ticket">
      <h2>Loyalty program</h2>
      <div id="loyalty-msg" class="msg hidden"></div>
      <p class="lead">Reward repeat customers automatically. Changes apply immediately to new orders.</p>
      <div class="checkline"><input type="checkbox" id="w-loy-active" ${lp.active ? 'checked' : ''}/> Enable loyalty program</div>
      <div class="row">
        <div><label>Type</label>
          <select id="w-loy-type" onchange="document.getElementById('threshold-label').textContent = this.value === 'points' ? 'Cashback %' : 'Items needed'">
            <option value="punch" ${lp.type==='punch'?'selected':''}>Punch card (buy N qualifying drinks/items)</option>
            <option value="points" ${lp.type==='points'?'selected':''}>Points (% cashback on spend)</option>
          </select>
        </div>
        <div><label id="threshold-label">${lp.type === 'points' ? 'Cashback %' : 'Items needed'}</label><input id="w-loy-threshold" value="${lp.punch_threshold || lp.points_percent || ''}" placeholder="e.g. 9"/></div>
      </div>
      <p class="small" style="margin:8px 0 0">Counts individual qualifying <strong>items</strong>, not orders — a customer buying 3 drinks in one visit progresses 3 units toward the reward, not 1. Choose which items count in the Menu tab (e.g. exclude pastries).</p>
      <label>Reward description</label><input id="w-loy-desc" value="${lp.reward_description || ''}" placeholder="Free drink of choice"/>
      ${lp.type === 'points' ? `<label>Reward value (EGP, optional)</label><input id="w-loy-value" value="${lp.reward_value || ''}" placeholder="65"/>` : `
        <div class="msg" style="background:rgba(61,107,74,0.1);color:var(--ok);border:1px solid rgba(61,107,74,0.3);margin-top:14px">
          ✓ The reward is automatic — when a customer's qualifying drink completes the count, that exact drink's real price becomes the discount. No value to configure.
        </div>
        <input type="hidden" id="w-loy-value" value="${lp.reward_value || ''}"/>
      `}
      <div class="nav-actions">
        <span></span>
        <button class="btn btn-solid" onclick="saveLoyaltyFromTab()">Save loyalty settings</button>
      </div>
    </div>
  `;
}
function saveLoyaltyFromTab() {
  const active = document.getElementById('w-loy-active').checked;
  const type = document.getElementById('w-loy-type').value;
  const threshold = document.getElementById('w-loy-threshold').value;
  const desc = document.getElementById('w-loy-desc').value;
  const value = document.getElementById('w-loy-value').value;
  saveLoyalty(active, type, threshold, desc, value);
}

function renderSettingsTab() {
  const t = state.tenant;
  return `
    <div class="ticket">
      <h2>Store details</h2>
      <div id="settings-msg" class="msg hidden"></div>
      <label>Café name</label><input id="s-name" value="${escapeHtml(t.name)}"/>
      <label>Address</label><input id="s-address" value="${escapeHtml(t.address || '')}"/>
      <div class="row">
        <div><label>Primary color (hex)</label><input id="s-primary-color" value="${escapeHtml(t.primary_color || '')}" placeholder="#2E7D32"/></div>
        <div><label>Accent color (hex)</label><input id="s-accent-color" value="${escapeHtml(t.accent_color || '')}" placeholder="#D9A44C"/></div>
      </div>
      <label>Logo URL</label><input id="s-logo-url" value="${escapeHtml(t.logo_url || '')}" placeholder="https://…"/>
      <div class="nav-actions">
        <span class="small">Slug: ${escapeHtml(t.slug)} · Currency: ${escapeHtml(t.currency)}</span>
        <button class="btn btn-solid" onclick="submitSettings()">Save changes</button>
      </div>
    </div>
    <div class="ticket">
      <h2>Kitchen staff</h2>
      <p class="lead">Invite by email — they'll get a real invitation, click the link, set their own password, and land straight in the kitchen queue. No code to share, no self-serve signup.</p>
      <div id="invite-msg" class="msg hidden"></div>
      <div class="row" style="align-items:center">
        <div><input id="invite-email" type="email" placeholder="staff@example.com"/></div>
        <div style="flex:0 0 auto"><button class="btn btn-sm btn-solid" onclick="sendKitchenInvite()">Send invite</button></div>
      </div>
      <hr class="divider"/>
      <h3>Current staff</h3>
      <div id="staff-list"><div class="small">Loading…</div></div>
    </div>
    <div class="ticket" id="payment-gateway-section">
      <h2>Payment Gateway</h2>
      <div class="small">Loading…</div>
    </div>
  `;
}

async function sendKitchenInvite() {
  const email = document.getElementById('invite-email').value.trim();
  if (!email) return showMsg('invite-msg', 'Enter an email address.', 'error');
  const { data: { session } } = await sb.auth.getSession();
  const res = await fetch(`${SUPABASE_URL}/functions/v1/invite-kitchen-staff`, {
    method: 'POST',
    headers: { 'Authorization': `Bearer ${session.access_token}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({
      tenant_id: state.tenant.id, email,
      redirect_to: `https://${PLATFORM_DOMAIN}/console.html`
    })
  });
  const data = await res.json();
  if (data.error) return showMsg('invite-msg', data.error, 'error');
  showMsg('invite-msg', `Invite sent to ${email}.`, 'ok');
  document.getElementById('invite-email').value = '';
  loadStaffList();
}

async function loadStaffList() {
  const el = document.getElementById('staff-list');
  if (!el) return;
  const { data, error } = await sb.rpc('get_tenant_staff_list', { p_tenant_id: state.tenant.id });
  if (error || !data) { el.innerHTML = '<div class="small">Could not load staff.</div>'; return; }
  if (data.length === 0) { el.innerHTML = '<div class="empty">No staff invited yet.</div>'; return; }
  el.innerHTML = data.map(s => `
    <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)">
      <div>
        <strong>${escapeHtml(s.email)}</strong>
        <span class="pill ${s.confirmed ? 'ok' : 'warn'}" style="margin-left:6px">${s.confirmed ? s.role : 'invite pending'}</span>
        <div class="small">Invited ${new Date(s.joined_at).toLocaleDateString()}</div>
      </div>
      <button class="btn btn-sm" style="color:var(--error);border-color:var(--error)" onclick="removeStaffMember('${s.user_id}','${escapeHtml(s.email)}')">Remove</button>
    </div>
  `).join('');
}

// ============================================================
// PAYMENT GATEWAY — each café picks its own provider. Stripe doesn't
// officially support Egyptian merchants, so the real local options
// (Paymob, Kashier, PayTabs, Fawry) use direct credential entry instead
// of an OAuth-style connect flow.
// ============================================================
const PAYMENT_PROVIDERS = {
  paymob: {
    label: 'Paymob', flow: 'credentials',
    blurb: 'Most developer-friendly Egyptian gateway — cards, mobile wallets, Apple/Google Pay, installments.',
    fields: [
      { key: 'api_key', label: 'API Key', placeholder: 'From Paymob Dashboard → Settings' },
      { key: 'hmac_secret', label: 'HMAC Secret', placeholder: 'From Paymob Dashboard → Settings' },
      { key: 'integration_id', label: 'Card Integration ID', placeholder: 'From Developers → Payment Integrations' },
      { key: 'iframe_id', label: 'Iframe ID', placeholder: 'From Developers → iFrames' },
      { key: 'public_key', label: 'Public Key', placeholder: 'From Paymob Dashboard → Settings' }
    ]
  },
  kashier: {
    label: 'Kashier', flow: 'credentials',
    blurb: 'Modern Egyptian gateway with a clean checkout experience.',
    fields: [
      { key: 'merchant_id', label: 'Merchant ID (MID)', placeholder: 'e.g. MID-46-111 — shown under your username in the dashboard' },
      { key: 'api_key', label: 'Payment API Key', placeholder: 'From "Payment API Keys" section — the UUID, e.g. d6f77d13-...' },
      { key: 'secret_key', label: 'Secret Key (not used for checkout — kept for future direct API calls)', placeholder: 'From "Secret Keys" section' }
    ]
  },
  paytabs: {
    label: 'PayTabs', flow: 'credentials',
    blurb: 'MENA-wide gateway — useful if you operate across Egypt and the Gulf.',
    fields: [
      { key: 'profile_id', label: 'Profile ID', placeholder: 'From PayTabs Dashboard' },
      { key: 'server_key', label: 'Server Key', placeholder: 'From PayTabs Dashboard → Developers' },
      { key: 'client_key', label: 'Client Key', placeholder: 'From PayTabs Dashboard → Developers' }
    ]
  },
  fawry: {
    label: 'Fawry', flow: 'credentials',
    blurb: "Egypt's largest payment network — 300,000+ physical payment points nationwide.",
    fields: [
      { key: 'merchant_code', label: 'Merchant Code', placeholder: 'From FawryPay Merchant Portal' },
      { key: 'security_key', label: 'Security Key', placeholder: 'From FawryPay Merchant Portal' }
    ]
  },
  stripe: {
    label: 'Stripe', flow: 'oauth',
    blurb: 'Requires a company registered outside Egypt (Stripe does not support Egyptian merchants directly).'
  }
};

let paymentGatewayState = { status: null, selectedProvider: null };

async function loadPaymentGatewayStatus() {
  const { data } = await sb.rpc('get_payment_gateway_status', { p_tenant_id: state.tenant.id });
  paymentGatewayState.status = data;
  renderPaymentGatewaySection();
}

function renderPaymentGatewaySection() {
  const el = document.getElementById('payment-gateway-section');
  if (!el) return;
  const st = paymentGatewayState.status;

  if (st && st.status === 'configured') {
    const p = PAYMENT_PROVIDERS[st.provider];
    el.innerHTML = `
      <h2>Payment Gateway</h2>
      <div class="msg ok" style="display:flex;justify-content:space-between;align-items:center">
        <span>✓ Connected to <strong>${p ? p.label : st.provider}</strong></span>
        <button class="btn btn-sm" style="color:var(--error);border-color:var(--error)" onclick="disconnectGateway()">Disconnect</button>
      </div>
      <p class="small" style="margin-top:8px">Configured ${st.configured_at ? new Date(st.configured_at).toLocaleDateString() : ''}. Credentials are stored securely and never shown again — disconnect and reconnect to change them.</p>
    `;
    return;
  }

  el.innerHTML = `
    <h2>Payment Gateway</h2>
    <p class="lead">Choose the provider your café already uses (or wants to use) to accept customer payments.</p>
    <div id="provider-cards" class="grid2" style="grid-template-columns:1fr 1fr;gap:10px"></div>
    <div id="provider-form-area" style="margin-top:16px"></div>
  `;
  renderProviderCards();
}

function renderProviderCards() {
  const el = document.getElementById('provider-cards');
  if (!el) return;
  el.innerHTML = Object.entries(PAYMENT_PROVIDERS).map(([key, p]) => `
    <div class="category-block" style="cursor:pointer;padding:14px;${paymentGatewayState.selectedProvider===key?'border-color:var(--gold)':''}" onclick="selectPaymentProvider('${key}')">
      <h3 style="font-size:15px;margin-bottom:4px">${p.label}</h3>
      <p class="small">${p.blurb}</p>
    </div>
  `).join('');
}

function selectPaymentProvider(key) {
  paymentGatewayState.selectedProvider = key;
  renderProviderCards();
  const p = PAYMENT_PROVIDERS[key];
  const formArea = document.getElementById('provider-form-area');

  if (p.flow === 'oauth') {
    formArea.innerHTML = `
      <div class="ticket" style="padding:16px;background:#fff">
        <p class="small" style="margin-bottom:10px">${p.blurb}</p>
        <button class="btn btn-solid" onclick="startStripeOnboarding()">Connect with Stripe</button>
      </div>
    `;
    return;
  }

  formArea.innerHTML = `
    <div class="ticket" style="padding:16px;background:#fff">
      <div id="gateway-msg" class="msg hidden"></div>
      ${p.fields.map(f => `<label>${f.label}</label><input id="gw-field-${f.key}" placeholder="${f.placeholder}"/>`).join('')}
      <button class="btn btn-solid" style="margin-top:14px" onclick="savePaymentCredentials('${paymentGatewayState.selectedProvider}')">Connect ${p.label}</button>
    </div>
  `;
}

async function savePaymentCredentials(providerKey) {
  const p = PAYMENT_PROVIDERS[providerKey];
  const credentials = {};
  for (const f of p.fields) {
    const val = document.getElementById(`gw-field-${f.key}`).value.trim();
    if (!val) return showMsg('gateway-msg', `${f.label} is required.`, 'error');
    credentials[f.key] = val;
  }
  const { data, error } = await sb.rpc('save_payment_gateway_credentials', {
    p_tenant_id: state.tenant.id, p_provider: providerKey, p_credentials: credentials
  });
  if (error || (data && data.error)) return showMsg('gateway-msg', 'Could not save credentials.', 'error');
  await loadPaymentGatewayStatus();
}

async function disconnectGateway() {
  if (!confirm('Disconnect your payment gateway? Customers won\'t be able to pay online until you reconnect one.')) return;
  await sb.rpc('disconnect_payment_gateway', { p_tenant_id: state.tenant.id });
  paymentGatewayState.selectedProvider = null;
  await loadPaymentGatewayStatus();
}

async function removeStaffMember(userId, email) {
  if (!confirm(`Remove ${email}'s access to your café?`)) return;
  await sb.rpc('remove_tenant_staff', { p_tenant_id: state.tenant.id, p_user_id: userId });
  loadStaffList();
}

async function startStripeOnboarding() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return;
  const res = await fetch(`${SUPABASE_URL}/functions/v1/stripe-connect-onboarding`, {
    method: 'POST',
    headers: { 'Authorization': `Bearer ${session.access_token}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({ tenant_id: state.tenant.id, return_url: window.location.href, refresh_url: window.location.href })
  });
  const data = await res.json();
  if (data.error) return alert('Could not start onboarding: ' + data.error);
  window.location.href = data.url;
}
</script>
