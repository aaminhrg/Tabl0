<!DOCTYPE html>
<html lang="en">
<head>

<title>Order</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --espresso: #2B1D14;
    --crema: #F2E9DC;
    --paper: #FAF6EF;
    --gold: #C08A2E;
    --gold-bright: #D9A44C;
    --line: #C9B8A0;
    --ink: #2B1D14;
    --ink-soft: #6B5B47;
    --error: #A63D2F;
    --ok: #3D6B4A;
    --radius: 10px;
    --mono: 'Courier New', Courier, monospace;

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--crema); color: var(--ink);
    font-family: Georgia, 'Times New Roman', serif; min-height: 100vh; padding-bottom: 90px;

  .hero {
    background: var(--espresso); color: var(--crema); padding: 22px 20px 26px;
    border-bottom: 3px solid var(--gold);
  }
  .hero-slug { font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold-bright); margin-bottom: 4px; }
  .hero-name { font-size: 24px; margin: 0 0 4px; }
  .hero-table { font-family: var(--mono); font-size: 12px; color: var(--line); }

  .wrap { max-width: 560px; margin: 0 auto; padding: 18px 16px; }

  .loyalty-banner {
    background: #fff; border: 1px solid var(--gold); border-radius: var(--radius);
    padding: 12px 16px; margin-bottom: 16px; display:flex; align-items:center; gap: 12px;
  }
  .loyalty-progress-track { flex:1; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .loyalty-progress-fill { height: 100%; background: var(--gold); }
  .loyalty-text { font-family: var(--mono); font-size: 12px; color: var(--ink-soft); white-space: nowrap; }

  .signin-strip {

  .signin-strip a { color: var(--gold); cursor: pointer; text-decoration: underline; }

  h2 {
    font-size: 15px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-soft);
    margin: 22px 0 12px; padding-bottom: 8px; border-bottom: 1px dashed var(--line);
  }

  .item {
    background: #fff; border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px;
    border: 1px solid var(--line); display:flex; align-items:center; gap: 12px; cursor:pointer;
  }
  .item:active { background: var(--crema); }
  .item-info { flex: 1; }
  .item-title { font-size: 16px; font-weight: bold; }
  .item-desc { font-size: 13px; color: var(--ink-soft); margin-top: 2px; }
  .item-price { font-family: var(--mono); font-size: 14px; color: var(--ink-soft); white-space: nowrap; }
  .item.sold-out { opacity: 0.5; cursor: not-allowed; }
  .sold-out-tag { font-family: var(--mono); font-size: 10px; color: var(--error); text-transform: uppercase; }

  .empty { padding: 40px 16px; text-align:center; color: var(--ink-soft); font-style: italic; }

  /* modal */
  .overlay {
    position: fixed; inset: 0; background: rgba(43,29,20,0.6); display:flex; align-items:flex-end;
    justify-content:center; z-index: 50;
  }
  .sheet {
    background: var(--paper); width: 100%; max-width: 560px; border-radius: 16px 16px 0 0;
    padding: 22px 20px 24px; max-height: 88vh; overflow-y: auto;

  .sheet-title { font-size: 20px; font-weight: bold; margin: 0 0 4px; }
  .sheet-desc { font-size: 13px; color: var(--ink-soft); margin-bottom: 16px; }
  .group-title { font-family: var(--mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-soft); margin: 16px 0 8px; display:flex; justify-content:space-betwe[...]
  .req-tag { color: var(--gold); }
  .option-row {
    display:flex; align-items:center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line);
    border-radius: 8px; margin-bottom: 6px; background:#fff; cursor:pointer;
  }
  .option-row.selected { border-color: var(--gold); background: #FBF3E4; }
  .option-row.disabled { opacity: 0.45; cursor: not-allowed; }
  .option-name { flex:1; }
  .option-delta { font-family: var(--mono); font-size: 12px; color: var(--ink-soft); }

  .qty-row { display:flex; align-items:center; gap: 14px; margin: 18px 0; justify-content:center; }
  .qty-btn {
    width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--gold); background: #fff;
    color: var(--gold); font-size: 18px; cursor: pointer;
  }
  .qty-val { font-family: var(--mono); font-size: 18px; min-width: 24px; text-align:center; }

  .btn { font-family: var(--mono); font-size: 14px; padding: 13px 18px; border: none; border-radius: 8px;
    background: var(--gold); color: var(--espresso); font-weight: bold; cursor: pointer; width: 100%; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-ghost { background: transparent; border: 1px solid var(--line); color: var(--ink-soft); font-weight: normal; }
  .btn-close { position:absolute; top:16px; right:16px; background:none; border:none; font-size: 20px; color: var(--ink-soft); cursor:pointer; }

  .cart-bar {
    position: fixed; bottom: 0; left: 0; right: 0; background: var(--espresso); color: var(--crema);
    padding: 14px 18px; display:flex; align-items:center; justify-content:space-between; z-index: 40;
    box-shadow: 0 -4px 16px rgba(0,0,0,0.3);
  }
  .cart-bar-left { font-family: var(--mono); font-size: 13px; }
  .cart-bar-btn { background: var(--gold); color: var(--espresso); border:none; border-radius: 8px; padding: 11px 20px; font-weight:bold; font-family: var(--mono); font-size: 13px; cursor:pointer[...]

  .cart-line { display:flex; align-items:center; gap:10px; padding: 10px 0; border-bottom: 1px dashed var(--line); }
  .cart-line-info { flex:1; }
  .cart-line-name { font-weight: bold; }
  .cart-line-variants { font-size: 12px; color: var(--ink-soft); }
  .cart-line-remove { background:none; border:none; color: var(--error); cursor:pointer; font-family: var(--mono); font-size: 12px; }
  .cart-total-row { display:flex; justify-content:space-between; padding: 10px 0; font-family: var(--mono); }
  .cart-total-row.grand { font-size: 16px; font-weight:bold; border-top: 1px solid var(--line); margin-top: 8px; padding-top: 12px; }
  .reward-row { color: var(--ok); }

  .otp-input { text-align:center; letter-spacing: 0.4em; font-size: 22px; font-family: var(--mono); }
  input {
    width: 100%; font-family: Georgia, serif; font-size: 15px; padding: 11px 12px;
    border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); margin-top: 6px;
  }
  label { display:block; font-family: var(--mono); font-size: 11px; color: var(--ink-soft); margin-top: 14px; }
  .msg { font-family: var(--mono); font-size: 12px; padding: 8px 12px; border-radius: 6px; margin-top: 12px; }
  .msg.error { background: rgba(166,61,47,0.1); color: var(--error); }
  .msg.ok { background: rgba(61,107,74,0.1); color: var(--ok); }
  .center-screen { min-height: 100vh; display:flex; align-items:center; justify-content:center; text-align:center; padding: 20px; }
</style>
</head>

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Reads /t/{cafe_slug}/{table_code} from the path, OR ?cafe=&table= for
// easy testing by just opening this file directly in a browser.
function parseTarget() {
  const params = new URLSearchParams(window.location.search);
  if (params.get('cafe') && params.get('table')) {
    return { cafeSlug: params.get('cafe'), tableCode: params.get('table') };
  }
  const parts = window.location.pathname.split('/').filter(Boolean);
  const tIdx = parts.indexOf('t');
  if (tIdx !== -1 && parts[tIdx + 1] && parts[tIdx + 2]) {
    return { cafeSlug: parts[tIdx + 1], tableCode: parts[tIdx + 2] };
  }
  return null;
}

let state = {
  view: 'loading',
  target: null,
  data: null,       // resolve_table_link() payload
  cart: [],          // [{ item, quantity, selectedOptions: [...], lineKey }]
  activeItem: null,   // item currently open in the picker sheet
  pickerSelections: {}, // groupId -> [optionId,...]
  pickerQty: 1,
  showCartSheet: false,
  loyalty: null,       // get_loyalty_status() payload
  otpStage: null,       // null | 'enter-phone' | 'enter-code'
  phone: '',
  lastOrder: null,
  msg: null
};

const root = document.getElementById('app-root');

async function boot() {
  const target = parseTarget();
  if (!target) {
    state.view = 'error';
    state.msg = 'No table link found. Scan a table\'s QR code, or open this page with ?cafe=slug&table=CODE for testing.';
    return render();
  }
  state.target = target;

  const { data: { session } } = await sb.auth.getSession();

  const { data, error } = await sb.rpc('resolve_table_link', {
    p_cafe_slug: target.cafeSlug, p_table_code: target.tableCode
  });
  if (error || !data) {
    state.view = 'error';
    state.msg = 'This table link looks invalid. Please ask staff for help.';
    return render();
  }
  state.data = data;
  state.view = 'menu';

  if (session) await refreshLoyalty();
  render();
}
boot();

async function refreshLoyalty() {
  const { data } = await sb.rpc('get_loyalty_status', { p_cafe_slug: state.target.cafeSlug });
  state.loyalty = data;
}

// ---------- Cart helpers ----------
function priceForOptions(item, groupSelections) {
  let total = item.base_price;
  for (const g of item.variant_groups) {
    for (const optId of (groupSelections[g.id] || [])) {
      const opt = g.options.find(o => o.id === optId);
      if (opt) total += Number(opt.price_delta);
    }
  }
  return total;
}
function variantsSummary(item, groupSelections) {
  const parts = [];
  for (const g of item.variant_groups) {
    for (const optId of (groupSelections[g.id] || [])) {
      const opt = g.options.find(o => o.id === optId);
      if (opt) parts.push(opt.name);
    }
  }
  return parts.join(', ');
}
function cartTotal() {
  return state.cart.reduce((sum, line) => sum + line.unitPrice * line.quantity, 0);
}
function cartCount() {
  return state.cart.reduce((sum, line) => sum + line.quantity, 0);
}

  if (item.sold_out) return;

    } else {
      state.pickerSelections[g.id] = [];
    }
  });
  state.pickerQty = 1;
  render();
}
function closeItemPicker() { state.activeItem = null; render(); }
